name: Scheduled Instagram Reels IPO Publisher

on:
  schedule:
    # 1) Morning Run: 09:42 AM IST (04:12 UTC) - Off-peak minute after render completes
    - cron: '12 4 * * *'
    # 2) Evening Run: 08:12 PM IST (14:42 UTC) - Off-peak minute after render completes
    - cron: '42 14 * * *'

  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run pipeline now (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: instagram-reels-publisher
  cancel-in-progress: false

jobs:
  publish-reels:
    name: Sync Drive, Generate Viral Caption & Publish to Instagram Reels
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Instagram Reels Auto-Publisher Pipeline
        env:
          # Google Drive Ingestion
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}

          # Meta Instagram Graph API
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v21.0' }}

          # AI Metadata Generation (Groq)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
        run: npm run publish

      - name: Commit & Push Updated Upload Trackers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/uploaded_instagram.json
          if git diff --staged --quiet; then
            echo "✨ No new videos uploaded. Trackers are up-to-date."
          else
            git commit -m "chore: record new video upload to Instagram Reels [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Trackers committed and pushed to main."
          fi
